<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Causal DAG Explorer MCP architecture</title>
  <desc id="desc">The MCP host coordinates Home Assistant evidence and the local Day DAG MCP. The local MCP launches an Express website. Both the Express API and MCP use the same local JSON store.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f5f1ff"/>
    </linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d55e9"/>
      <stop offset="1" stop-color="#4d38bd"/>
    </linearGradient>
    <linearGradient id="local" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6cf1"/>
      <stop offset="1" stop-color="#1749b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15336a" flood-opacity=".12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2b63d7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6d55d9"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", sans-serif; fill: #14254a; }
      .title { font-size: 44px; font-weight: 800; letter-spacing: -1.4px; }
      .subtitle { font-size: 18px; fill: #64718a; }
      .box-title { font-size: 22px; font-weight: 750; }
      .box-copy { font-size: 15px; fill: #60708b; }
      .white { fill: white; }
      .tiny { font-size: 13px; fill: #72809a; }
      .tag { font-size: 12px; font-weight: 750; }
      .step { font-size: 14px; font-weight: 800; fill: white; }
      .arrow-label { font-size: 13px; font-weight: 700; fill: #415b91; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1470" cy="90" r="170" fill="#e7eeff" opacity=".7"/>
  <circle cx="110" cy="820" r="170" fill="#eee8ff" opacity=".55"/>
  <text x="800" y="70" text-anchor="middle" class="title">Causal DAG Explorer MCP Architecture</text>
  <text x="800" y="105" text-anchor="middle" class="subtitle">A truthful local-first flow: the MCP host coordinates evidence; the diagram server never calls Home Assistant directly.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="260" height="190" rx="25" fill="white" stroke="#cfdbef" stroke-width="2"/>
    <circle cx="128" cy="263" r="30" fill="#eaf1ff"/>
    <circle cx="128" cy="254" r="10" fill="#3971ec"/>
    <path d="M105 290c5-18 41-18 46 0" fill="#3971ec"/>
    <text x="175" y="258" class="box-title">User</text>
    <text x="175" y="283" class="box-copy">Builds and edits DAGs</text>
    <text x="98" y="332" class="box-copy">• asks a question</text>
    <text x="98" y="358" class="box-copy">• inspects supplied evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="165" width="325" height="270" rx="28" fill="url(#host)"/>
    <rect x="468" y="195" width="62" height="62" rx="17" fill="#ffffff" opacity=".16"/>
    <path d="M485 226l10 10 20-24" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="553" y="218" class="box-title white">MCP Host / Codex</text>
    <text x="553" y="243" class="box-copy white" opacity=".82">The orchestrator</text>
    <rect x="470" y="283" width="265" height="42" rx="11" fill="#fff" opacity=".13"/>
    <text x="492" y="310" class="white" font-size="15">1. Reads bounded HA evidence</text>
    <rect x="470" y="336" width="265" height="42" rx="11" fill="#fff" opacity=".13"/>
    <text x="492" y="363" class="white" font-size="15">2. Calls local DAG MCP tools</text>
    <text x="470" y="408" class="tiny white" opacity=".78">No server-to-server MCP call is implied.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="885" y="160" width="320" height="170" rx="25" fill="white" stroke="#8db2ff" stroke-width="2"/>
    <rect x="915" y="195" width="56" height="56" rx="15" fill="#e7f0ff"/>
    <path d="M930 224l13-13 13 13v15h-26z" fill="#2c6ded"/>
    <text x="994" y="211" class="box-title">HA Unofficial AI MCP</text>
    <text x="994" y="239" class="box-copy">Search entities and read history</text>
    <text x="915" y="288" class="tiny">Returns bounded observations to the MCP host.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="885" y="375" width="320" height="205" rx="25" fill="url(#local)"/>
    <rect x="915" y="408" width="56" height="56" rx="15" fill="#fff" opacity=".16"/>
    <circle cx="930" cy="427" r="5" fill="white"/>
    <circle cx="956" cy="423" r="5" fill="white"/>
    <circle cx="945" cy="449" r="5" fill="white"/>
    <path d="M935 428l16-4m-18 8l9 13m12-17l-7 16" stroke="white" stroke-width="3" fill="none"/>
    <text x="994" y="426" class="box-title white">Day DAG MCP</text>
    <text x="994" y="454" class="box-copy white" opacity=".82">Local stdio server</text>
    <text x="916" y="503" class="white" font-size="15">• day CRUD and diagram updates</text>
    <text x="916" y="530" class="white" font-size="15">• graph validation and app launch</text>
    <text x="916" y="557" class="tiny white" opacity=".78">Accepts compact evidence supplied by the host.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1280" y="245" width="250" height="190" rx="25" fill="white" stroke="#bad0f5" stroke-width="2"/>
    <rect x="1310" y="278" width="48" height="48" rx="13" fill="#edf3ff"/>
    <path d="M1323 313v-21h23v21m-18-14h13m-13 6h13" stroke="#2d67df" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="1381" y="294" class="box-title">Express API</text>
    <text x="1381" y="320" class="box-copy">127.0.0.1 only</text>
    <text x="1310" y="370" class="box-copy">Serves the React editor</text>
    <text x="1310" y="396" class="box-copy">and validates REST saves.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1280" y="520" width="250" height="175" rx="25" fill="white" stroke="#b8dfd3" stroke-width="2"/>
    <ellipse cx="1335" cy="562" rx="25" ry="11" fill="#dff6ee" stroke="#2b9f76" stroke-width="3"/>
    <path d="M1310 562v40c0 6 11 11 25 11s25-5 25-11v-40m-50 20c0 6 11 11 25 11s25-5 25-11" fill="none" stroke="#2b9f76" stroke-width="3"/>
    <text x="1381" y="565" class="box-title">Local JSON</text>
    <text x="1381" y="591" class="box-copy">Atomic file writes</text>
    <text x="1310" y="654" class="tiny">No cloud, account, or credentials.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="635" width="560" height="175" rx="25" fill="white" stroke="#cfd9eb" stroke-width="2"/>
    <text x="480" y="680" class="box-title">React DAG Explorer UI</text>
    <text x="480" y="709" class="box-copy">Drag boxes • connect handles • select/delete • save/reload</text>
    <rect x="480" y="740" width="118" height="32" rx="16" fill="#eaf2ff"/>
    <text x="539" y="761" text-anchor="middle" class="tag" fill="#245dce">DAG canvas</text>
    <rect x="610" y="740" width="138" height="32" rx="16" fill="#fff0f4"/>
    <text x="679" y="761" text-anchor="middle" class="tag" fill="#c42e58">Evidence strip</text>
    <rect x="760" y="740" width="166" height="32" rx="16" fill="#eaf8f2"/>
    <text x="843" y="761" text-anchor="middle" class="tag" fill="#18825f">Local day library</text>
  </g>

  <path d="M330 290H420" stroke="#2b63d7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <circle cx="375" cy="270" r="14" fill="#2b63d7"/><text x="375" y="275" text-anchor="middle" class="step">1</text>
  <path d="M765 235H865" stroke="#6d55d9" stroke-width="4" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="815" y="215" text-anchor="middle" class="arrow-label">read</text>
  <path d="M885 295C820 338 820 402 865 445" stroke="#6d55d9" stroke-width="4" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="818" y="374" text-anchor="middle" class="arrow-label">compact observations</text>
  <path d="M765 350C820 370 830 420 865 465" stroke="#6d55d9" stroke-width="4" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="795" y="433" text-anchor="middle" class="arrow-label">tool calls</text>
  <path d="M1205 458C1260 442 1264 395 1280 365" stroke="#2b63d7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1248" y="447" text-anchor="middle" class="arrow-label">launches</text>
  <path d="M1000 722C1130 722 1190 390 1280 360" stroke="#2b63d7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1150" y="650" text-anchor="middle" class="arrow-label">HTTP CRUD</text>
  <path d="M1405 435V500" stroke="#2b63d7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1422" y="475" class="arrow-label">save</text>
  <path d="M1205 545C1240 575 1250 590 1280 600" stroke="#2b63d7" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1222" y="600" text-anchor="middle" class="arrow-label">same store</text>

  <rect x="70" y="837" width="1460" height="38" rx="19" fill="#eff3fa"/>
  <circle cx="105" cy="856" r="7" fill="#21a16c"/>
  <text x="123" y="862" class="tiny">Privacy boundary: runtime data stays local. Public examples and screenshots use synthetic values only.</text>
</svg>
