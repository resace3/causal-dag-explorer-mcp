[project]
name = "yesterday-timeline-server"
version = "0.1.0"
description = "MCP server + local API that reconstructs the previous day from Home Assistant and wearable data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "mcp>=2.0",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "anyio>=4.6",
]

[project.scripts]
yesterday-timeline-mcp = "app.mcp.server:main"
yesterday-timeline-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
